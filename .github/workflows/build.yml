name: Build PowerPoint Verse APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip and find project
        run: |
          ZIP=$(find . -iname "*.zip" -not -path "./.git/*" | sort -V | tail -1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no zip file found in the repo"
            exit 1
          fi
          echo "Using zip: $ZIP"
          mkdir -p src_unzipped
          unzip -q "$ZIP" -d src_unzipped || true
          rm -rf src_unzipped/__MACOSX
          PUBSPEC=$(find src_unzipped -name "pubspec.yaml" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found inside the zip"
            exit 1
          fi
          echo "PROJECT_DIR=$(cd "$(dirname "$PUBSPEC")" && pwd)" >> $GITHUB_ENV

      # FIX: lint of Android needs Java 21 (Java 17 crashes with List.removeLast)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # FIX: disable the (useless for us) lintVital tasks for every module
      - name: Disable lintVital in Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze') || t.name.startsWith('lintReport')) {
                t.enabled = false
              }
            }
          }
          GRADLE

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project (name, permissions, JS library)
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash setup_android.sh

      - name: Check JS library was downloaded
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ls -l assets/web/
          test "$(wc -c < assets/web/pptxgen.bundle.js)" -gt 100000 || { echo "pptxgen bundle missing"; exit 1; }

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$PROJECT_DIR"/build/app/outputs/flutter-apk/app-release.apk dist/PowerPoint-Verse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PowerPoint-Verse-apk
          path: dist/PowerPoint-Verse.apk
